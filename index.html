<h1>Hoş Geldin Sevgilim ❤️</h1>

<p>
Belki şu an aramızda kilometreler var.
Ama sana ait bir dünya oluşturmak istedim.
<br><br>

Burası benim kalbimin sana açılan kapısı.
<br><br>

Her yıldızda bir dileğim, her mektupta bir parçam,
her köşesinde sana ait bir sevgim var.
<br><br>

İyi ki varsın.
<br><br>

<span style="color:#ffd5e9;font-size:20px">
— Ali ❤️
</span>
</p>
